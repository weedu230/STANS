name: Deploy STANS

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install deps
        run: npm install

      - name: Build app
        run: npm run build

      - name: Build Docker image
        run: docker build -t stans-app .

      - name: Login DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push image
        run: |
          docker tag stans-app ${{ secrets.DOCKER_USERNAME }}/stans-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/stans-app:latest